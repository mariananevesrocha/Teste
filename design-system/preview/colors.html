<!-- @dsCard group="Colors" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); }
  .sw { height: 130px; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 12px; font-weight: 700; font-stretch: 125%; text-transform: uppercase; }
  .bar { display: flex; height: 18px; }
</style>
<div class="prio-root">
  <div class="row">
    <div class="sw" style="background:var(--color-blue)">Azul<br>#1A2BFF</div>
    <div class="sw" style="background:var(--color-blue-deep)">Azul profundo<br>#0B14C9</div>
    <div class="sw paper-lime">Verde neon<br>#C4FF1F</div>
    <div class="sw" style="background:var(--color-ink)">Ink<br>#040846</div>
  </div>
  <div class="bar"><div style="flex:80;background:var(--color-blue)"></div><div style="flex:15;background:var(--color-lime)"></div><div style="flex:5;background:#fff"></div></div>
</div>
